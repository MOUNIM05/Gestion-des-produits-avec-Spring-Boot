spring.application.name=gestion-produits
server.port=${PORT:8080}
spring.datasource.url=${H2_URL:jdbc:h2:file:./data/products}
spring.datasource.username=sa
spring.datasource.password=${H2_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.thymeleaf.cache=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.seed-data=true
app.demo.user-password=${DEMO_USER_PASSWORD:}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:}
