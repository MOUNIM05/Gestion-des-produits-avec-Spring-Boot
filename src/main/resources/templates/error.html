<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Une erreur est survenue</title></head><body><section layout:fragment="content" class="panel error-panel"><span class="error-code" th:text="${status ?: 500}">500</span><i class="bi bi-compass error-icon" aria-hidden="true"></i><h1 th:text="${errorTitle ?: (status == 404 ? 'Page introuvable' : 'Une erreur est survenue')}"></h1><p th:text="${errorMessage ?: (status == 404 ? 'La page demandée est introuvable.' : 'Votre demande n’a pas pu aboutir. Veuillez réessayer.')}"></p><a class="btn btn-primary" th:href="@{/}">Retour à l'accueil</a></section></body></html>
